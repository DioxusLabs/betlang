[package]
name = "betlang"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Tiny source-language detection for code."
readme = "README.md"
repository = "https://github.com/ealmloff/betlang"
homepage = "https://github.com/ealmloff/betlang"
documentation = "https://docs.rs/betlang"
keywords = ["language", "detection", "code", "magika"]
categories = ["development-tools", "text-processing"]
include = [
    "/Cargo.lock",
    "/Cargo.toml",
    "/LICENSE",
    "/BENCHMARKS.md",
    "/MODEL_CARD.md",
    "/README.md",
    "/RELEASING.md",
    "/assets/confusion-by-size.png",
    "/assets/magika/source-student-q4.bin",
    "/benches/detect.rs",
    "/examples/*.rs",
    "/snippets/demo.rs",
    "/src/**",
    "/tests/**",
]

[dependencies]
fearless_simd = "0.4"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
ignore = "0.4.25"
rand = "0.8"
rayon = "1.10"

[lib]
name = "betlang"
path = "src/lib.rs"

[[bench]]
name = "detect"
harness = false

[workspace]
resolver = "3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
