name: Bug report
description: Report a reproducible Betlang problem.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Include a small source snippet or file when possible. Avoid private code.
  - type: input
    id: version
    attributes:
      label: Betlang version
      placeholder: "0.0.1"
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input
      description: Minimal source text, bytes description, or repository path shape that reproduces the issue.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Rust version, OS, CPU architecture, and whether wasm is involved.
      render: text
    validations:
      required: false
